services:
  postgres:
    image: postgres:16
    container_name: Entrevista_APP
    restart: always
    environment:
      POSTGRES_DB: DBentrevista
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d DBentrevista"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./BasedeDatos.EntrevistaApp.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./BasedeDatos.EntrevistaApp.Seeds.sql:/docker-entrypoint-initdb.d/002-seeds.sql:ro

volumes:
  pgdata:

